services:
  postgres:
    image: postgres:16
    container_name: etf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: etf_user
      POSTGRES_PASSWORD: etfpass123
      POSTGRES_DB: etf_risk
    ports:
      - "5433:5432"
    volumes:
      - etf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etf_user"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  etf_postgres_data:
